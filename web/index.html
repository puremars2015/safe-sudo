<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hermes 安全 sudo 輸入</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="/app.js" defer></script><style>body{font-family:system-ui,sans-serif;background:#101827;color:#edf2f7;margin:0;padding:24px}main{max-width:480px;margin:auto}h1{font-size:24px}p{line-height:1.6}label{display:block;margin-top:22px}input,button{box-sizing:border-box;width:100%;padding:14px;font-size:18px;border-radius:9px;margin-top:12px}input{color:#fff;background:#1c2b40;border:1px solid #51667f}button{background:#3690f0;color:white;border:none}button:disabled{opacity:.45}.note{color:#a8bacf;font-size:14px}#status{white-space:pre-line;min-height:40px}</style></head><body><main><h1>安全 sudo 密碼輸入</h1><!--operation--><p class="note">密碼透過 HTTPS 表單直送伺服器，不作為 Telegram 聊天訊息，也不傳給 AI 模型或寫入應用日誌。連線經 Cloudflare，非端對端加密；Cloudflare 為受信任的 TLS 代理。僅在可信任的裝置使用。</p><form id="form" autocomplete="off"><label for="password">sudo 密碼</label><input id="password" name="local-secret" type="password" autocomplete="off" maxlength="512" autocapitalize="none" spellcheck="false" required disabled><button id="submit" type="submit" disabled>確認本次操作並送出</button></form><p id="status" role="status">正在檢查 Telegram 工作階段…</p><p class="note">僅限原 Telegram 使用者。一次性授權，5 分鐘失效；每張表單只允許一次 sudo 嘗試。請勿在聊天內傳送密碼。</p></main></body></html>
